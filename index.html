<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maxim Cruz</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght=300;400;500;700;900&display=swap" rel="stylesheet">

<style>
*{ margin:0; padding:0; box-sizing:border-box; }
body{ background:#000; color:white; font-family:'Inter',sans-serif; min-height:100vh; overflow-x:hidden; }
.container{ max-width:420px; margin:auto; padding:18px; perspective: 1200px; }

/* PORTADA */
.about-me{ position:relative; width:100%; height:310px; border-radius:28px; overflow:hidden; display:flex; justify-content:center; align-items:center; margin-bottom:22px; background: linear-gradient(rgba(0,0,0,.8), rgba(0,0,0,.9)), radial-gradient(circle at center, rgba(255,255,255,.05) 1px, transparent 1px); background-size:cover,22px 22px; }
.hero-bg{ position:absolute; top: 50%; left: 50%; z-index: 1; font-size: 24vw; font-weight:900; letter-spacing:-4px; color:rgba(255,255,255,.12); white-space:nowrap; user-select:none; pointer-events:none; opacity: 0; transform: translate(-50%, -50%) scale(0.8); filter: blur(10px); animation: epicReveal 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards; }
.hero-content{ position:relative; z-index:2; text-align:center; }
.hero-top{ margin-bottom:10px; color:rgba(255,255,255,.75); font-size:11px; letter-spacing:4px; opacity: 0; animation: fadeIn 1s ease 0.8s forwards; }
.about-me h1{ line-height:.9; font-size:42px; font-weight:900; color:#fff; -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.3) 4%, #fff 14%, #fff 86%, rgba(255,255,255,0.3) 96%, transparent 100%); opacity: 0; letter-spacing: 4px; animation: tlouErosionReveal 2.2s cubic-bezier(0.25, 1, 0.25, 1) 0.4s forwards; }

/* SECCIÓN ACERCA DE */
.section-title{ display: block; text-align: center; font-size: 11px; font-weight: 400; letter-spacing: 4px; color: rgba(255, 255, 255, 0.5); text-transform: uppercase; margin-bottom: 14px; opacity: 0; animation: fadeInUp 0.8s ease forwards; animation-delay: 1.1s; }
.bio-container { width: 100%; background: #050505; border-radius: 26px; padding: 24px; margin-bottom: 15px; display: flex; align-items: center; gap: 20px; border: 1px solid rgba(255,255,255,0.05); opacity: 0; transform: translateY(25px) scale(0.97); animation: appModernReveal 1.2s cubic-bezier(0.22, 1, 0.36, 1) 1.2s forwards; }
.bio-text { color: #a1a1aa; font-size: 13px; line-height: 1.5; flex: 1; margin-bottom: 0; }
.video-thumbnail { min-width: 85px; height: 85px; border-radius: 50%; position: relative; cursor: pointer; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); transition: transform 0.3s ease; }
.video-thumbnail img { width: 100%; height: 100%; object-fit: cover; }
.video-thumbnail .play-icon { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.3); }
.video-thumbnail .play-icon svg { width: 35px; height: 35px; fill: white; opacity: 0.7; }
.video-thumbnail:hover { transform: scale(1.05); }

/* ICONOS SOCIALES */
.social-container { display: flex; justify-content: center; align-items: center; gap: 30px; margin-bottom: 30px; opacity: 0; animation: fadeIn 1s ease 1.5s forwards; }
.social-icon { width: 28px; height: 28px; fill: white; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); opacity: 0.7; }
.social-icon:hover { transform: scale(1.2); opacity: 1; }
.nlg-link { color: white; text-decoration: none; font-weight: 700; font-size: 18px; opacity: 0.7; transition: 0.3s; }
.nlg-link:hover { opacity: 1; transform: scale(1.1); }

/* VIDEO SIN CUADRO, SOLO REC */
#inlineVideoWrapper { height: 0; opacity: 0; overflow: hidden; transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1); transform-style: preserve-3d; position: relative; }
#inlineVideoWrapper.active { height: 480px; opacity: 1; margin-bottom: 28px; transform: rotateX(8deg) scale(0.85); }

.rec-indicator { position: absolute; top: 15px; left: 15px; z-index: 10; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: white; text-transform: uppercase; letter-spacing: 1px; }
.red-dot { width: 8px; height: 8px; background: red; border-radius: 50%; animation: blink 1s infinite; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

#inlineVideo { width: 100%; height: 100%; object-fit: contain; background: transparent; border-radius: 0; }

/* PROGRESO */
.phone{ width:100%; background:#050505; border-radius:26px; padding:18px; border:1px solid rgba(255,255,255,.06); box-shadow:0 10px 40px rgba(0,0,0,.7); opacity: 0; animation: appModernReveal 1.2s cubic-bezier(0.22, 1, 0.36, 1) 1.5s forwards; }
.card{ background:#0b0b0b; border-radius:22px; padding:10px; border:1px solid rgba(255,255,255,.05); }
.habit{ display:flex; justify-content:space-between; align-items:center; padding:18px 10px; border-bottom:1px solid rgba(255,255,255,.07); }
.habit:last-child{ border:none; }
.left{ display:flex; align-items:center; gap:16px; }
.icon{ width:70px; height:70px; border-radius:18px; background:#111; display:flex; justify-content:center; align-items:center; }
.icon svg{ width:34px; height:34px; stroke:white; }
.habit-info h3{ font-size:20px; font-weight:700; margin-bottom:5px; }
.habit-info p{ color:#a1a1aa; font-size:15px; }
.progress{ width:74px; height:74px; border-radius:50%; display:flex; justify-content:center; align-items:center; background: conic-gradient(#22c55e var(--percent), #1b1b1b 0); position:relative; }
.progress::before{ content:""; position:absolute; width:58px; height:58px; border-radius:50%; background:#050505; }
.progress span{ position:relative; z-index:2; font-size:18px; font-weight:700; }

/* ANIMACIONES */
@keyframes epicReveal { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); filter: blur(10px); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0px); } }
@keyframes tlouErosionReveal { 0% { opacity: 0; filter: blur(14px); } 100% { opacity: 1; filter: blur(0px); } }
@keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
@keyframes appModernReveal { 0% { opacity: 0; transform: translateY(30px) scale(0.96); filter: blur(4px); } 100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0px); } }
@keyframes fadeInUp { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div class="container">
  <div class="about-me">
    <div class="hero-bg">MAXIM</div>
    <div class="hero-content">
      <div class="hero-top">PROYECTO</div>
      <h1>THE LAST ONE</h1>
    </div>
  </div>

  <span class="section-title">Acerca de</span>
  <div class="bio-container">
    <p class="bio-text">Hola, soy Maxim. Diseñador enfocado en experiencias visuales de alto rendimiento y estética minimalista. Este espacio documenta mi camino.</p>
    <div class="video-thumbnail" id="openVideo">
      <img src="./WhatsApp Image 2026-05-24 at 12.03.41 AM.jpeg" alt="Perfil">
      <div class="play-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
    </div>
  </div>

  <div class="social-container">
    <a href="LINK_FACEBOOK"><svg class="social-icon" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg></a>
    <a href="LINK_NLG" class="nlg-link">NLG</a>
    <a href="LINK_TIKTOK"><svg class="social-icon" viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.77 0 2.89 2.89 0 0 1 2.89-2.89h.6V8.18h-.6a6.39 6.39 0 1 0 6.39 6.39V8.67a8.16 8.16 0 0 0 4.63 1.48v-3.46z"/></svg></a>
  </div>

  <div id="inlineVideoWrapper">
    <div class="rec-indicator"><div class="red-dot"></div>REC</div>
    <video id="inlineVideo" controls playsinline>
      <source src="./Diseño sin título.mp4" type="video/mp4">
    </video>
  </div>

  <span class="section-title">Progreso</span>
  <div class="phone">
    <div class="card">
        <div class="habit">
            <div class="left"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3"/><path d="M12 19v3"/></svg></div>
            <div class="habit-info"><h3>0</h3><p>15 min</p></div></div>
            <div class="progress" style="--percent:0%;"><span>0%</span></div>
        </div>
    </div>
  </div>
</div>

<script>
  const btn = document.getElementById("openVideo");
  const wrapper = document.getElementById("inlineVideoWrapper");
  const video = document.getElementById("inlineVideo");
  btn.onclick = function() { wrapper.classList.add("active"); video.play(); }
  video.onended = function() { wrapper.classList.remove("active"); video.pause(); video.currentTime = 0; }
</script>
</body>
</html>
